<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Dragon Eye Video Player">
  <title>Dragon Eye</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>️</text></svg>">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #container {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    #startScreen {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      cursor: pointer;
    }
    #startScreen h1 {
      color: #ff4500;
      font-family: Arial, sans-serif;
      font-size: 24px;
      margin-bottom: 20px;
      text-align: center;
    }
    #startScreen p {
      color: #888;
      font-family: Arial, sans-serif;
      font-size: 14px;
      margin-bottom: 30px;
    }
    #startBtn {
      background: linear-gradient(135deg, #ff4500, #ff6a00);
      color: white;
      border: none;
      padding: 20px 40px;
      font-size: 18px;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(255, 69, 0, 0.4);
      transition: transform 0.2s;
    }
    #startBtn:active {
      transform: scale(0.95);
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="startScreen">
    <h1>👁️ Dragon Eye</h1>
    <p>Toca para comenzar</p>
    <button id="startBtn">INICIAR</button>
  </div>

  <div id="container">
    <video id="vid" playsinline loop muted>
      <source src="video.mp4" type="video/mp4">
    </video>
  </div>

  <script>
    const video = document.getElementById('vid');
    const startScreen = document.getElementById('startScreen');
    const startBtn = document.getElementById('startBtn');
    let isPlaying = false;

    // Función para reproducir el video
    async function playVideo() {
      try {
        video.muted = true;
        video.playsInline = true;
        video.setAttribute('playsinline', '');
        video.setAttribute('webkit-playsinline', '');
        
        await video.play();
        isPlaying = true;
        console.log('✅ Video reproduciéndose');
      } catch (err) {
        console.error('❌ Error al reproducir:', err);
      }
    }

    // Función para fullscreen (solo con interacción del usuario)
    async function goFullscreen() {
      try {
        const elem = document.documentElement;
        if (elem.requestFullscreen) {
          await elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
          await elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) {
          await elem.msRequestFullscreen();
        }
        console.log('✅ Fullscreen activado');
      } catch (err) {
        console.warn('⚠️ Fullscreen no disponible:', err.message);
      }
    }

    // Bloquear orientación
    function lockOrientation() {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('portrait').catch(() => {
          console.log('Orientación no bloqueada');
        });
      }
    }

    // Evento principal - cuando el usuario toca/clickea
    async function handleUserInteraction() {
      console.log('👆 Interacción del usuario detectada');
      
      // Ocultar pantalla de inicio
      startScreen.classList.add('hidden');
      
      // Reproducir video
      await playVideo();
      
      // Activar fullscreen
      await goFullscreen();
      
      // Bloquear orientación
      lockOrientation();
      
      // Mantener pantalla encendida
      if ('wakeLock' in navigator) {
        navigator.wakeLock.request('screen').catch(() => {});
      }
    }

    // Event listeners
    startBtn.addEventListener('click', handleUserInteraction);
    startScreen.addEventListener('touchstart', handleUserInteraction, { once: true });
    startScreen.addEventListener('click', handleUserInteraction, { once: true });

    // Loop infinito
    video.addEventListener('ended', () => {
      console.log('🔄 Reiniciando video...');
      video.currentTime = 0;
      video.play();
    });

    // Si el video se pausa, intentar reproducir de nuevo
    video.addEventListener('pause', () => {
      if (!video.ended && isPlaying) {
        video.play();
      }
    });

    // Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('✅ Service Worker registrado'))
        .catch(err => console.error('❌ SW error:', err));
    }

    // Prevenir zoom y gestos no deseados
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
    document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  </script>
</body>
</html>
