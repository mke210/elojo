<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Dragon Eye</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: none;
    }
    #container {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    #startScreen {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    #startScreen h1 {
      color: #ff4500;
      font-family: Arial, sans-serif;
      font-size: 28px;
      margin-bottom: 10px;
      text-align: center;
    }
    #startScreen p {
      color: #666;
      font-family: Arial, sans-serif;
      font-size: 14px;
      margin-bottom: 30px;
    }
    #startBtn {
      background: linear-gradient(135deg, #ff4500, #ff6a00);
      color: white;
      border: none;
      padding: 20px 40px;
      font-size: 18px;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(255, 69, 0, 0.4);
    }
    #loadingMsg {
      color: #ff4500;
      font-family: Arial, sans-serif;
      font-size: 16px;
      margin-top: 20px;
      display: none;
    }
    #errorMsg {
      color: #ff0000;
      font-family: Arial, sans-serif;
      font-size: 14px;
      margin-top: 20px;
      padding: 15px;
      background: #220000;
      border-radius: 10px;
      max-width: 80%;
      text-align: center;
      display: none;
    }
    #debugInfo {
      color: #444;
      font-family: monospace;
      font-size: 11px;
      margin-top: 30px;
      text-align: center;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="startScreen">
    <h1>👁️ Dragon Eye</h1>
    <p>Toca para comenzar</p>
    <button id="startBtn">INICIAR</button>
    <div id="loadingMsg">⏳ Cargando video...</div>
    <div id="errorMsg"></div>
    <div id="debugInfo">video.mp4</div>
  </div>

  <div id="container">
    <video id="vid" playsinline loop muted preload="auto">
      <source src="video.mp4" type="video/mp4">
    </video>
  </div>

  <script>
    const video = document.getElementById('vid');
    const startScreen = document.getElementById('startScreen');
    const startBtn = document.getElementById('startBtn');
    const loadingMsg = document.getElementById('loadingMsg');
    const errorMsg = document.getElementById('errorMsg');
    const debugInfo = document.getElementById('debugInfo');

    // Verificar si el video existe
    async function checkVideoExists() {
      try {
        const response = await fetch('video.mp4', { method: 'HEAD' });
        if (!response.ok) {
          throw new Error('Video no encontrado (404)');
        }
        const size = response.headers.get('content-length');
        debugInfo.textContent = `✓ video.mp4 (${(size/1024/1024).toFixed(2)} MB)`;
        return true;
      } catch (err) {
        debugInfo.textContent = `✗ Error: ${err.message}`;
        return false;
      }
    }

    // Verificar al cargar
    window.addEventListener('load', () => {
      checkVideoExists();
      
      // Precargar video
      video.load();
      debugInfo.textContent += ' | Preparando...';
    });

    async function handleUserInteraction() {
      console.log('👆 Iniciando...');
      loadingMsg.style.display = 'block';
      startBtn.disabled = true;

      try {
        // Configurar video
        video.muted = true;
        video.playsInline = true;
        video.setAttribute('playsinline', '');
        
        // Intentar reproducir
        console.log(' Intentando reproducir...');
        await video.play();
        console.log('✅ Video reproduciéndose');
        
        // Ocultar pantalla de inicio
        startScreen.classList.add('hidden');
        
        // Fullscreen
        try {
          if (document.documentElement.requestFullscreen) {
            await document.documentElement.requestFullscreen();
          }
        } catch (e) {
          console.log('Fullscreen omitido:', e.message);
        }
        
        // Wake lock
        if ('wakeLock' in navigator) {
          try {
            await navigator.wakeLock.request('screen');
          } catch (e) {}
        }
        
      } catch (err) {
        console.error('❌ Error:', err);
        loadingMsg.style.display = 'none';
        startBtn.disabled = false;
        
        let msg = 'Error desconocido';
        if (err.name === 'NotAllowedError') {
          msg = 'Autoplay bloqueado. Toca la pantalla.';
        } else if (err.message.includes('404')) {
          msg = ' video.mp4 no encontrado en GitHub';
        } else if (err.name === 'NotSupportedError') {
          msg = 'Formato de video no compatible';
        }
        
        errorMsg.textContent = msg;
        errorMsg.style.display = 'block';
      }
    }

    // Eventos del video
    video.addEventListener('loadeddata', () => {
      console.log('✅ Video cargado:', video.duration, 'segundos');
    });

    video.addEventListener('error', (e) => {
      console.error('❌ Error de video:', video.error);
      let msg = 'Error al cargar video';
      if (video.error.code === 4) msg = 'Formato no soportado';
      if (video.error.code === 1) msg = 'Video cancelado';
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
      loadingMsg.style.display = 'none';
    });

    video.addEventListener('ended', () => {
      video.currentTime = 0;
      video.play();
    });

    // Event listeners
    startBtn.addEventListener('click', handleUserInteraction);

    // Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
